name: Folegol annotation integration

on:
  push:
    branches:
      - folegol/annotation-playback-m1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folegol-annotation-m1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  movi-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Refresh lockfile metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: movi-player-lockfile-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Persist refreshed lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(folegol): refresh npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --run

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Pack immutable integration artifact
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts

      - name: Upload integration package
        uses: actions/upload-artifact@v4
        with:
          name: movi-player-0.4.1-folegol.1
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 90
