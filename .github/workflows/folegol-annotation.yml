name: Folegol annotation integration

on:
  push:
    branches:
      - folegol/annotation-playback-m1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folegol-annotation-m1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  movi-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --run

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Pack immutable integration artifact
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts

      - name: Upload integration package
        uses: actions/upload-artifact@v4
        with:
          name: movi-player-folegol-integration
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 90
